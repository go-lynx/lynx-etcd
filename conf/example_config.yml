# Etcd 配置中心插件配置示例

lynx:
  etcd:
    # etcd 服务器端点列表（必填，每项不能为空）
    endpoints:
      - "127.0.0.1:2379"

    # 运行时默认值：timeout=10s，dial_timeout=5s，namespace=lynx/config
    timeout: 10s
    dial_timeout: 5s
    namespace: "lynx/config"

    # 认证信息（可选）
    username: ""
    password: ""

    # TLS 配置
    enable_tls: false
    cert_file: ""
    key_file: ""
    ca_file: ""

    # 这些开关默认都是 false，需要时显式打开
    enable_cache: true
    enable_metrics: true
    enable_retry: true
    max_retry_times: 3
    retry_interval: 1s

    # 清理阶段默认超时为 10s
    shutdown_timeout: 10s

    # 服务注册 / 发现是显式开启能力
    enable_register: false
    enable_discovery: false
    registry_namespace: "lynx/services"
    ttl: 30s

    # 多配置源加载
    service_config:
      prefix: "lynx/config"
      additional_prefixes:
        - "lynx/config/app"

    # 兼容保留字段：当前实现会接受，但不把它们当成功能开关
    # enable_graceful_shutdown: true
    # enable_logging: true
    # log_level: "info"
    # service_config.priority: 0
    # service_config.merge_strategy: "override"


